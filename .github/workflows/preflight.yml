name: LeadGap preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile main.py outreach_v101.py smoke_test.py preflight_v101_test.py wave2_test.py src/enrichment/*.py src/verification/*.py
      - name: Existing smoke tests
        run: python smoke_test.py
      - name: Outreach v1.0.1 preflight
        run: python preflight_v101_test.py

      - name: Wave2 unit tests
        run: python wave2_test.py
      - name: CatalogFix wave-1 calibration
        env:
          RUN_ID: lg-2026-09-22-01
          RUN_TIMESTAMP_UTC: 2026-09-22T04:12:00Z
        run: python run_catalogfix_wave1.py
      - name: Upload CatalogFix wave-1 calibration
        uses: actions/upload-artifact@v4
        with:
          name: catalogfix-wave1-calibration
          path: research/wave1_output/
          if-no-files-found: error
